spring.application.name=credit-engine-api

# ============================================================
# Jackson / Datas
# ============================================================
spring.jackson.time-zone=America/Sao_Paulo

# ============================================================
# Database - PostgreSQL
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}?serverTimezone=America/Sao_Paulo
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ============================================================
# Flyway
# ============================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ============================================================
# Swagger/OpenAPI
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ============================================================
# CORS
# ============================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}